name: Publish renderer

on:
  push:
    tags: ["ecad-renderer-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build --workspace=@huaqiu/ecad-renderer
      - run: npm test --workspace=@huaqiu/ecad-renderer
      - run: npm publish --workspace=@huaqiu/ecad-renderer --provenance
